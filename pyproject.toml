[project]
name = "nlosformer"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "==3.10.*"

dependencies = [
    "torch==2.6.0",
    "scikit-image",
    "opencv-python",
    "Tensorboard",
    "timm",
    "einops",
    "numpy",
    "matplotlib",
    "accelerate>=1.9.0",
    "ema-pytorch>=0.7.7",
    "mitsuba==3.5.2",
    "ipykernel>=6.30.0",
    "pywavefront>=1.3.3",
]

[tool.uv]
package = true
cache-dir = "/data/.uv_cache"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools.packages.find]
include = ["./*.py"]
